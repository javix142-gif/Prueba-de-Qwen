name: Build Oraculo Tarot APK

on:
  push:
    branches:
      - agent/oraculo-tarot-laura-apk
    paths:
      - 'oraculo-source.part*'
      - '.github/workflows/build-oraculo-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'oraculo-source.part*'
      - '.github/workflows/build-oraculo-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oraculo-tarot-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract isolated Android project
        run: |
          cat oraculo-source.part* > source.tar.gz.b64
          base64 --decode source.tar.gz.b64 > source.tar.gz
          tar -xzf source.tar.gz

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate tarot logic
        working-directory: oraculo-tarot-laura-android
        run: node --test tests/*.mjs

      - name: Check JavaScript syntax
        working-directory: oraculo-tarot-laura-android
        run: |
          node --check android-web/js/app.js
          node --check android-web/js/tarot-data.js
          node --check android-web/js/tarot-engine.js
          node --check android-web/js/storage.js
          node --check android-web/service-worker.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable APK
        id: android-build
        continue-on-error: true
        working-directory: oraculo-tarot-laura-android
        run: |
          set -o pipefail
          gradle --no-daemon clean lintDebug assembleDebug --stacktrace 2>&1 | tee ../android-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oraculo-Tarot-Laura-build-log
          path: android-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Prepare artifact
        if: steps.android-build.outcome == 'success'
        run: |
          mkdir -p deliverable
          cp oraculo-tarot-laura-android/app/build/outputs/apk/debug/app-debug.apk deliverable/Oraculo-Tarot-Laura-v1.0.0.apk
          sha256sum deliverable/Oraculo-Tarot-Laura-v1.0.0.apk | tee deliverable/SHA256.txt
          stat --format='APK size: %s bytes' deliverable/Oraculo-Tarot-Laura-v1.0.0.apk | tee deliverable/SIZE.txt

      - name: Upload APK
        if: steps.android-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Oraculo-Tarot-Laura-v1.0.0
          path: deliverable/
          if-no-files-found: error
          retention-days: 30

      - name: Fail when Android build fails
        if: steps.android-build.outcome != 'success'
        run: exit 1
