name: Validate v2.1 corrective final

on:
  push:
    branches: ["rpg-ilyrion-v21-final-build"]
    paths:
      - "v21_corrective_parts/**"
      - ".github/workflows/validate-v21-corrective-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Verify final transported fragments
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < v21_corrective_parts/part_09)" -eq 18000
          for i in 00 01 02 03 04 05 06 07 08; do test "$(wc -c < v21_corrective_parts/p09s$i)" -eq 1000; done
          test "$(wc -c < v21_corrective_parts/part_10a)" -eq 9000
          test "$(wc -c < v21_corrective_parts/part_10b)" -eq 9000
          test "$(wc -c < v21_corrective_parts/part_11)" -eq 4560
          head -c 9000 v21_corrective_parts/part_09 > /tmp/part_09a
          echo "f36c122fc3096d309b71b91c888cb9708ff6f34f579e8742ae0f24673293be6d  /tmp/part_09a" | sha256sum -c -
          echo "a3fc20df7aa53f736eb1c4ed2db69cdd85034e290356963c3d4e13993ed587b0  v21_corrective_parts/p09s00" | sha256sum -c -
          echo "e0231e8bdacf85e793cc5d254ef2b05206d67397308c3f59fbbd1e277c138cec  v21_corrective_parts/p09s01" | sha256sum -c -
          echo "2e8485434581dc16b8ef0d5b952693e41f424f982da48de98ef713697319a500  v21_corrective_parts/p09s02" | sha256sum -c -
          echo "cbd488b0533f318fbd0bf40ec3e298c2ecaf06981bd732553e76b49755da9d37  v21_corrective_parts/p09s03" | sha256sum -c -
          echo "1a76723a35e4b7a582bca4a6c7e1d33e4cf2e8bee83579c102d6595245713129  v21_corrective_parts/p09s04" | sha256sum -c -
          echo "cb99b8ee7cf853750b5efb2f92f5c4447e512f27584508e1ce7caf45b223058c  v21_corrective_parts/p09s05" | sha256sum -c -
          echo "615b287e37e652da9014405ffe9d20049eb7f74abcf0beaeb2f8e659de79f01b  v21_corrective_parts/p09s06" | sha256sum -c -
          echo "de9465ddea4640370c19b616f77cfca9ad50fc89a42c0c9c826bea5ea9e8c775  v21_corrective_parts/p09s07" | sha256sum -c -
          echo "a1f66b393b7eaeb37373f2b24a9e9f6652bb5251af7681e7679688621d2a5b4c  v21_corrective_parts/p09s08" | sha256sum -c -
          cat v21_corrective_parts/p09s00 v21_corrective_parts/p09s01 v21_corrective_parts/p09s02 v21_corrective_parts/p09s03 v21_corrective_parts/p09s04 v21_corrective_parts/p09s05 v21_corrective_parts/p09s06 v21_corrective_parts/p09s07 v21_corrective_parts/p09s08 > /tmp/part_09b
          echo "ac29512ada8eb253ef7d8969d1ff2a2bc1859a77c8dd53abee960f83601ac5ec  /tmp/part_09b" | sha256sum -c -
          cat /tmp/part_09a /tmp/part_09b > /tmp/part_09
          echo "c1273148f7879f99ae9a4bfa60d89e194b424ee937c8747baed483df4638f033  /tmp/part_09" | sha256sum -c -
          echo "0c7ff4f95007c85db5e6ee21e4d6a671b1fe10b3414c682fae19629c8acd403a  v21_corrective_parts/part_10a" | sha256sum -c -
          echo "c07413c0a18a72b8b51dcc2b20fcc79e0d668e3b10c07450352b94c8e76b6091  v21_corrective_parts/part_10b" | sha256sum -c -
          cat v21_corrective_parts/part_10a v21_corrective_parts/part_10b > /tmp/part_10
          echo "f080ea1bcffcc4dd047dc64a0a78612b28ca732c7a7fde74457f9369522a184e  /tmp/part_10" | sha256sum -c -
          echo "1278b93571e04f89ce6db11808d205e6c0f60ae8cd277455058314c70f99dfc4  v21_corrective_parts/part_11" | sha256sum -c -

      - name: Reconstruct corrective and require XZ and patch SHA-256
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v21-corrective.b64
          cat v21_corrective_parts/part_00 >> /tmp/v21-corrective.b64
          cat v21_corrective_parts/part_00_tail >> /tmp/v21-corrective.b64
          cat v21_corrective_parts/part_01 v21_corrective_parts/part_02 v21_corrective_parts/part_03 v21_corrective_parts/part_04 v21_corrective_parts/part_05 v21_corrective_parts/part_06 v21_corrective_parts/part_07 >> /tmp/v21-corrective.b64
          head -c 18000 v21_corrective_parts/part_08 >> /tmp/v21-corrective.b64
          cat /tmp/part_09 /tmp/part_10 v21_corrective_parts/part_11 >> /tmp/v21-corrective.b64
          test "$(wc -c < /tmp/v21-corrective.b64)" -eq 186560
          base64 -d /tmp/v21-corrective.b64 > /tmp/v21-corrective.patch.xz
          echo "54d5868998608b50a75f8694a0f3bb318d94e159c2b15a72b82307b9b7bd5f2a  /tmp/v21-corrective.patch.xz" | sha256sum -c -
          xz -dc /tmp/v21-corrective.patch.xz > /tmp/v21-corrective.patch
          echo "ea9853031dd60c5480ae16a1fbce772b432fc072b7af9fa78007ba991afc1377  /tmp/v21-corrective.patch" | sha256sum -c -

      - name: Reconstruct verified v2 base and original v2.1 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ilyrion
          cat v2_payload/part_* | base64 -d > /tmp/ilyrion.tar.xz
          echo "506597d95b2afdd1dca8142bc4f33afffd3e5b956db47ad5fc0074a9db0723b6  /tmp/ilyrion.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ilyrion.tar.xz -C /tmp/ilyrion
          cat v21_patch_parts/part_* | base64 -d > /tmp/v21.patch.xz
          echo "fe3ed59f2286a71902f62e6b00c83eebd8405decd61e152c366d497c7ddba963  /tmp/v21.patch.xz" | sha256sum -c -
          xz -dc /tmp/v21.patch.xz > /tmp/v21.patch
          echo "50250c346f65c63d0fdcff6f45e390c646fa4e9546c908627ffcfd5526839d73  /tmp/v21.patch" | sha256sum -c -
          cd /tmp/ilyrion
          patch --batch --forward app/src/main/assets/index.html < /tmp/v21.patch

      - name: Apply corrective and require final runtime SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ilyrion
          patch --batch --forward app/src/main/assets/index.html < /tmp/v21-corrective.patch
          echo "12959c81bde1088350cd6139ba85acee945008667ad663f6697f564b975a6ad5  app/src/main/assets/index.html" | sha256sum -c -
          echo "ALL_REQUIRED_SHA256_GATES=PASS"
