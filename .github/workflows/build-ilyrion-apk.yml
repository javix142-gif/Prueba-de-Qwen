name: Build Ilyrion APK
on:
  push:
    branches: ["rpg-ilyrion-completo"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct and verify isolated project
        run: |
          cat ilyrion_bundle/part_* > /tmp/ilyrion.b64
          base64 -d /tmp/ilyrion.b64 > /tmp/ilyrion.tar.gz
          echo "28d37bfe5b52eb04c7f1cfe71a538a2fc9af57e165c16320a9b88971443226df  /tmp/ilyrion.tar.gz" | sha256sum -c -
          mkdir -p /tmp/ilyrion
          tar -xzf /tmp/ilyrion.tar.gz -C /tmp/ilyrion
          cp ilyrion_ci/MainActivity.java /tmp/ilyrion/app/src/main/java/cl/javix/ilyrion/MainActivity.java
          cp ilyrion_ci/styles.xml /tmp/ilyrion/app/src/main/res/values/styles.xml
      - name: Static game tests
        working-directory: /tmp/ilyrion
        run: |
          node --check app/src/main/assets/game.js
          node --test tests/static.test.mjs
      - name: Locate and prepare Android SDK 36
        run: |
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK root: $SDKROOT"
          test -d "$SDKROOT"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDKROOT" >&2
            find "$SDKROOT" -maxdepth 4 -type f \( -name sdkmanager -o -name apksigner \) -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDKROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDKROOT" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$SDKROOT" > /tmp/ilyrion/local.properties
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
      - name: Install Gradle 9.3.1
        run: |
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"
      - name: Android tests, lint and build
        working-directory: /tmp/ilyrion
        run: |
          gradle --version
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Verify APK
        run: |
          APK=/tmp/ilyrion/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee APK_SHA256.txt
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee APK_SIGNATURE.txt
          cp "$APK" Ilyrion-Las-Cinco-Luces-v1.0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ilyrion-Las-Cinco-Luces-v1.0.1
          path: |
            Ilyrion-Las-Cinco-Luces-v1.0.1-debug.apk
            APK_SHA256.txt
            APK_SIGNATURE.txt
          retention-days: 30
