name: Build Ilyrion APK
on:
  push:
    branches: ["rpg-ilyrion-completo"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract isolated project
        run: |
          mkdir -p /tmp/ilyrion
          base64 -d ilyrion_project.tar.gz.b64 | tar -xz -C /tmp/ilyrion
      - name: Static game tests
        working-directory: /tmp/ilyrion
        run: |
          node --check app/src/main/assets/game.js
          node --test tests/static.test.mjs
      - name: Install Gradle 9.3.1
        run: |
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"
      - name: Android tests, lint and build
        working-directory: /tmp/ilyrion
        run: |
          gradle --version
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=/tmp/ilyrion/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee APK_SHA256.txt
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" | tee APK_SIGNATURE.txt
          cp "$APK" Ilyrion-Las-Cinco-Luces-v1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ilyrion-Las-Cinco-Luces-v1.0.0
          path: |
            Ilyrion-Las-Cinco-Luces-v1.0.0-debug.apk
            APK_SHA256.txt
            APK_SIGNATURE.txt
          retention-days: 30
