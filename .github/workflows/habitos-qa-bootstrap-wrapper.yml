name: Habitos QA - Bootstrap Wrapper

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/habitos-qa/**'
      - '.github/workflows/habitos-qa-bootstrap-wrapper.yml'

permissions:
  contents: write

jobs:
  wrapper:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate complete Gradle Wrapper
        working-directory: apps/habitos-qa
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin

      - name: Persist wrapper if generated
        shell: bash
        run: |
          if git diff --quiet -- apps/habitos-qa/gradlew apps/habitos-qa/gradlew.bat apps/habitos-qa/gradle/wrapper; then
            echo "Wrapper already complete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/habitos-qa/gradlew apps/habitos-qa/gradlew.bat apps/habitos-qa/gradle/wrapper
          git commit -m "build(habitos-qa): generate Gradle wrapper"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
