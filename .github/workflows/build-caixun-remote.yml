name: Build Caixun Remote APK

on:
  push:
    branches:
      - tv-remote-caixun-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build overlays
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Android TV Remote v2 base
        run: |
          git clone --depth 1 https://github.com/SebghatYusuf/android_remote.git caixun_remote
          cp tvremote/tv_remote_screen.dart caixun_remote/lib/src/ui/tv_remote_screen.dart
          cp tvremote/main.dart caixun_remote/lib/main.dart
          cp tvremote/AndroidManifest.xml caixun_remote/android/app/src/main/AndroidManifest.xml

      - name: Apply UI compatibility fixes
        working-directory: caixun_remote
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/src/ui/tv_remote_screen.dart')
          s = p.read_text()
          replacements = {
              '_DPad(key: key)': '_DPad(onKey: key)',
              '_TouchPad(key: key)': '_TouchPad(onKey: key)',
              '_NumberPad(key: key)': '_NumberPad(onKey: key)',
              '_ColorKeysButton(key: key)': '_ColorKeysButton(onKey: key)',
              'final ValueChanged<int> key;': 'final ValueChanged<int> onKey;',
              'required this.key': 'required this.onKey',
              '=> key(19)': '=> onKey(19)',
              '=> key(20)': '=> onKey(20)',
              '=> key(21)': '=> onKey(21)',
              '=> key(22)': '=> onKey(22)',
              '=> key(23)': '=> onKey(23)',
              'widget.key(': 'widget.onKey(',
              '=> key(7 + n)': '=> onKey(7 + n)',
              '=> key(7))': '=> onKey(7))',
              'onSelected: key,': 'onSelected: onKey,',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Set Android identity, activity and Gradle compatibility
        working-directory: caixun_remote
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('com.example.android_remote', 'cl.javix.caixunremote')
          gradle.write_text(s)

          activity = Path('android/app/src/main/kotlin/com/example/android_remote/MainActivity.kt')
          activity.write_text('''package cl.javix.caixunremote

import android.Manifest
import android.content.pm.PackageManager
import android.os.Build
import android.os.Bundle
import io.flutter.embedding.android.FlutterActivity

class MainActivity : FlutterActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
            checkSelfPermission(Manifest.permission.NEARBY_WIFI_DEVICES) != PackageManager.PERMISSION_GRANTED
        ) {
            requestPermissions(arrayOf(Manifest.permission.NEARBY_WIFI_DEVICES), 1001)
        }
    }
}
''')

          pubspec = Path('pubspec.yaml')
          t = pubspec.read_text().replace(
              'description: "A new Flutter project."',
              'description: "Control remoto Wi-Fi para Android TV, Google TV y televisores Caixun compatibles."'
          )
          pubspec.write_text(t)

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          u = wrapper.read_text().replace('gradle-8.13-bin.zip', 'gradle-8.14-bin.zip')
          wrapper.write_text(u)
          PY

      - name: Verify Android entry point
        working-directory: caixun_remote
        run: |
          grep -q 'namespace = "cl.javix.caixunremote"' android/app/build.gradle.kts
          grep -q 'applicationId = "cl.javix.caixunremote"' android/app/build.gradle.kts
          grep -q 'package cl.javix.caixunremote' android/app/src/main/kotlin/com/example/android_remote/MainActivity.kt
          grep -q 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: caixun_remote
        run: flutter pub get

      - name: Analyze app sources
        working-directory: caixun_remote
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: caixun_remote
        run: flutter build apk --release --build-name 1.1.0 --build-number 2

      - name: Rename APK
        run: cp caixun_remote/build/app/outputs/flutter-apk/app-release.apk Control_Remoto_Caixun_Universal_v1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Control_Remoto_Caixun_Universal_v1.1
          path: Control_Remoto_Caixun_Universal_v1.1.apk
          if-no-files-found: error
          retention-days: 7