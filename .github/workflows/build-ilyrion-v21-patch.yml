name: Build Ilyrion v2.1 Final Patch

on:
  push:
    branches: ["rpg-ilyrion-v21-build"]
    paths:
      - "v21_patch/**"
      - ".github/workflows/build-ilyrion-v21-patch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct verified v2 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ilyrion
          cat v2_payload/part_* | base64 -d > /tmp/ilyrion.tar.xz
          echo "506597d95b2afdd1dca8142bc4f33afffd3e5b956db47ad5fc0074a9db0723b6  /tmp/ilyrion.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ilyrion.tar.xz -C /tmp/ilyrion
          sha256sum /tmp/ilyrion/app/src/main/assets/index.html
          echo "93cb47b69211c9b0f4821e6f893db7b4cbb435b636f796a1f0bfa709f3ec2a66  /tmp/ilyrion/app/src/main/java/cl/javix/ilyrion/MainActivity.java" | sha256sum -c -
          echo "4af2605907730c71951ced1af2e1b00f9092169d8ef91e8845fa56866aa7c0d4  /tmp/ilyrion/app/src/main/AndroidManifest.xml" | sha256sum -c -

      - name: Transport and apply exact v2.1 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d v21_patch/html.patch.xz.b64 > /tmp/v21.patch.xz
          echo "fe3ed59f2286a71902f62e6b00c83eebd8405decd61e152c366d497c7ddba963  /tmp/v21.patch.xz" | sha256sum -c -
          xz -dc /tmp/v21.patch.xz > /tmp/v21.patch
          echo "50250c346f65c63d0fdcff6f45e390c646fa4e9546c908627ffcfd5526839d73  /tmp/v21.patch" | sha256sum -c -
          cd /tmp/ilyrion
          patch --batch --forward app/src/main/assets/index.html < /tmp/v21.patch
          echo "12959c81bde1088350cd6139ba85acee945008667ad663f6697f564b975a6ad5  app/src/main/assets/index.html" | sha256sum -c -
          sed -i "s/versionCode 20/versionCode 21/" app/build.gradle
          sed -i "s/versionName '2.0.0'/versionName '2.1.0'/" app/build.gradle
          grep -q "versionCode 21" app/build.gradle
          grep -q "versionName '2.1.0'" app/build.gradle
          cp "$GITHUB_WORKSPACE/v21_patch/v21.test.mjs" tests/v21.test.mjs
          echo "74bb93dc5f758db8cc43405f0c4e50442de15a815e1d8da60f55e19f8b5dff54  tests/v21.test.mjs" | sha256sum -c -

      - name: Expanded static suite
        working-directory: /tmp/ilyrion
        run: node --test tests/v21.test.mjs

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
          echo "sdk.dir=$SDKROOT" > /tmp/ilyrion/local.properties
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo '/opt/gradle-9.3.1/bin' >> "$GITHUB_PATH"

      - name: Android unit tests lint and assemble
        working-directory: /tmp/ilyrion
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Print lint report
        if: always()
        working-directory: /tmp/ilyrion
        shell: bash
        run: |
          find app/build -iname 'lint-results*.txt' -print -exec cat {} \; 2>/dev/null || true

      - name: Verify APK with apksigner and SHA-256
        working-directory: /tmp/ilyrion
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee APK_SIGNATURE.txt
          sha256sum "$APK" | tee APK_SHA256.txt
          cp "$APK" Ilyrion-Las-Cinco-Luces-v2.1.0.apk
          test -s Ilyrion-Las-Cinco-Luces-v2.1.0.apk

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilyrion-Las-Cinco-Luces-v2.1.0
          path: |
            /tmp/ilyrion/Ilyrion-Las-Cinco-Luces-v2.1.0.apk
            /tmp/ilyrion/APK_SHA256.txt
            /tmp/ilyrion/APK_SIGNATURE.txt
          retention-days: 30
