name: Split Android Toolchain Artifact

on:
  push:
    paths:
      - '.github/workflows/split-android-toolchain-artifact.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: '33822826295'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download completed Android toolchain artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name android-toolchain-linux \
            --dir "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/android-toolchain-linux.zip"
          ls -lh "$RUNNER_TEMP/source/android-toolchain-linux.zip"
          sha256sum "$RUNNER_TEMP/source/android-toolchain-linux.zip" | tee "$RUNNER_TEMP/android-toolchain-linux.zip.sha256"

      - name: Split into transfer-safe chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parts"
          split -b 400M -d -a 2 \
            "$RUNNER_TEMP/source/android-toolchain-linux.zip" \
            "$RUNNER_TEMP/parts/android-toolchain-linux.zip.part-"
          test -f "$RUNNER_TEMP/parts/android-toolchain-linux.zip.part-00"
          test -f "$RUNNER_TEMP/parts/android-toolchain-linux.zip.part-01"
          test ! -f "$RUNNER_TEMP/parts/android-toolchain-linux.zip.part-02"
          ls -lh "$RUNNER_TEMP/parts"/*
          sha256sum "$RUNNER_TEMP/parts"/*

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-transfer-part-00
          path: ${{ runner.temp }}/parts/android-toolchain-linux.zip.part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-transfer-part-01
          path: ${{ runner.temp }}/parts/android-toolchain-linux.zip.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload original SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-original-sha256
          path: ${{ runner.temp }}/android-toolchain-linux.zip.sha256
          retention-days: 1
          if-no-files-found: error
