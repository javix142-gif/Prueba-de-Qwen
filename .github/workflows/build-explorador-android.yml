name: Build Explorador Android

on:
  push:
    branches: [android-explorador-archivos]
    paths:
      - 'android-file-browser/**'
      - '.github/workflows/build-explorador-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-file-browser/**'
      - '.github/workflows/build-explorador-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle 9.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5-bin.zip
          unzip -q gradle-9.5-bin.zip
          echo "$PWD/gradle-9.5/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        working-directory: android-file-browser
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp android-file-browser/app/build/outputs/apk/debug/app-debug.apk ExploradorArchivos-1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ExploradorArchivos-APK
          path: ExploradorArchivos-1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
