name: Export Oraculo Source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-oraculo-source.yml'
      - '.github/workflows/build-oraculo-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-oraculo-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout archived source commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore source tree
        run: |
          set -euo pipefail
          cat oraculo-source.part* > source.tar.gz.b64
          base64 --decode source.tar.gz.b64 > source.tar.gz
          tar -xzf source.tar.gz
          cp oraculo-android-styles.xml oraculo-tarot-laura-android/app/src/main/res/values/styles.xml
          sed -i "s/version '8.11.1'/version '8.7.0'/" oraculo-tarot-laura-android/build.gradle

      - name: Regenerate Gradle Wrapper 8.9 from official distribution
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output gradle-8.9-bin.zip
          echo 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  gradle-8.9-bin.zip' | sha256sum --check
          unzip -q gradle-8.9-bin.zip -d gradle-dist
          cd oraculo-tarot-laura-android
          ../gradle-dist/gradle-8.9/bin/gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
          chmod +x gradlew

      - name: Verify regenerated wrapper and inventory
        run: |
          set -euo pipefail
          ROOT=oraculo-tarot-laura-android
          test -f "$ROOT/gradlew"
          test -f "$ROOT/gradlew.bat"
          test -f "$ROOT/gradle/wrapper/gradle-wrapper.jar"
          test -f "$ROOT/gradle/wrapper/gradle-wrapper.properties"
          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip' "$ROOT/gradle/wrapper/gradle-wrapper.properties"
          grep -F 'distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab' "$ROOT/gradle/wrapper/gradle-wrapper.properties"
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  oraculo-tarot-laura-android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          (cd "$ROOT" && ./gradlew --version)
          {
            echo 'SOURCE RECOVERY INVENTORY'
            echo "archive_sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)"
            echo "wrapper_jar_sha256=$(sha256sum "$ROOT/gradle/wrapper/gradle-wrapper.jar" | cut -d' ' -f1)"
            echo "file_count=$(find "$ROOT" -type f | wc -l)"
            echo "card_count=$(find "$ROOT/android-web/assets/cards" -maxdepth 1 -name '*.svg' ! -name 'card-back.svg' | wc -l)"
            echo 'FILES:'
            find "$ROOT" -type f -printf '%P\n' | sort
          } > recovery-report.txt

      - name: Upload complete recovered source
        uses: actions/upload-artifact@v4
        with:
          name: oraculo-tarot-laura-source-v1.0.0-complete
          path: |
            oraculo-tarot-laura-android/
            recovery-report.txt
          if-no-files-found: error
          retention-days: 7
