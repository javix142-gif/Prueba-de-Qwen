name: Habitos QA - Android QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/habitos-qa/app/**'
      - 'apps/habitos-qa/scripts/**'
      - 'apps/habitos-qa/build.gradle.kts'
      - 'apps/habitos-qa/settings.gradle.kts'
      - 'apps/habitos-qa/gradle.properties'
      - 'apps/habitos-qa/gradlew'
      - 'apps/habitos-qa/gradlew.bat'
      - 'apps/habitos-qa/gradle/wrapper/**'
      - '.github/workflows/habitos-qa-validate.yml'
      - '.github/workflows/habitos-qa-android-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habitos-qa-android-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: apps/habitos-qa
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/habitos-qa/**/*.gradle*

      - name: Enable KVM for Android emulator
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Prepare Gradle and QA directory
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew scripts/android-qa-emulator.sh
          mkdir -p qa/screenshots qa/test-results
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "workflow_run=$GITHUB_RUN_ID"
          } > qa/RUN_CONTEXT.txt

      - name: Assemble candidate APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Android emulator QA
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 300
          disable-animations: true
          working-directory: apps/habitos-qa
          script: bash scripts/android-qa-emulator.sh

      - name: Prepare and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk qa/Habitos-QA-v1.0.0-debug.apk
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging qa/Habitos-QA-v1.0.0-debug.apk > qa/APK_BADGING.txt
          "$AAPT" dump permissions qa/Habitos-QA-v1.0.0-debug.apk > qa/APK_PERMISSIONS.txt
          "$APKSIGNER" verify --print-certs qa/Habitos-QA-v1.0.0-debug.apk > qa/APK_SIGNATURE.txt
          grep -q "package: name='cl.habitosqa.app' versionCode='1' versionName='1.0.0'" qa/APK_BADGING.txt
          grep -q "sdkVersion:'26'" qa/APK_BADGING.txt
          grep -q "targetSdkVersion:'36'" qa/APK_BADGING.txt
          if grep -q "android.permission.INTERNET" qa/APK_PERMISSIONS.txt; then
            echo "ERROR: INTERNET permission is present."
            exit 1
          fi
          sha256sum qa/Habitos-QA-v1.0.0-debug.apk | tee qa/SHA256.txt
          {
            echo "name=Habitos-QA-v1.0.0-debug.apk"
            echo "applicationId=cl.habitosqa.app"
            echo "versionCode=1"
            echo "versionName=1.0.0"
            echo "minSdk=26"
            echo "targetSdk=36"
            echo "size_bytes=$(stat -c%s qa/Habitos-QA-v1.0.0-debug.apk)"
            echo "internet_permission=absent"
            echo "source_commit=$SOURCE_COMMIT"
            echo
            cat qa/APK_SIGNATURE.txt
          } > qa/APK_METADATA.txt
          cp -R app/build/outputs/androidTest-results/. qa/test-results/android 2>/dev/null || true
          cp -R app/build/reports/androidTests/. qa/test-results/android-reports 2>/dev/null || true

      - name: Write QA report
        shell: bash
        run: |
          set -euo pipefail
          cat > qa/QA_REPORT.md <<EOF
          # Hábitos QA 1.0.0 — QA automático

          - Source commit: $SOURCE_COMMIT
          - Workflow run: $GITHUB_RUN_ID
          - APK: Habitos-QA-v1.0.0-debug.apk
          - Emulator: Android API 35 x86_64 on GitHub-hosted Linux runner with KVM acceleration
          - Emulator runner: ReactiveCircus/android-emulator-runner pinned at a421e43855164a8197daf9d8d40fe71c6996bb0d (v2.38.0)
          - Instrumented Room + Compose tests: passed
          - Smoke install/cold start/process check: passed
          - Package: cl.habitosqa.app
          - INTERNET permission: absent
          - Screenshots: real emulator captures in screenshots/
          - Compact viewport smoke: 320x568 dp equivalent (880x1562 px @ 440 dpi)
          - Physical Android device: not tested by this workflow

          Visual approval must be completed by inspecting the captured PNG files; generation alone is not visual review.
          EOF

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habitos-qa-1.0.0-qa
          path: apps/habitos-qa/qa/
          if-no-files-found: error
          retention-days: 14
